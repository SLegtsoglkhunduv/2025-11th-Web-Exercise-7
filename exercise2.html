<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expanding Red Cube</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      *,
      *:focus,
      *:active,
      *:focus-visible {
        outline: none !important;
        box-shadow: none !important;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body
    class="bg-white min-h-screen flex items-center justify-center m-0 p-0 select-none"
  >
    <div
      id="redCube"
      onclick="toggleExpand()"
      class="bg-red-600 w-20 h-20 transition-all duration-300 ease-in-out cursor-pointer rounded-none"
    ></div>

    <script>
      let isExpanded = false;
      function toggleExpand() {
        const cube = document.getElementById("redCube");

        if (!isExpanded) {
          cube.classList.remove("w-20", "h-20");
          cube.classList.add("w-64", "h-64");
          isExpanded = true;
        } else {
          cube.classList.remove("w-64", "h-64");
          cube.classList.add("w-20", "h-20");
          isExpanded = false;
        }
      }
    </script>
  </body>
</html>
